name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.14"]
    env:
      CATEGORICAL_SAMPLERS_NO_OPENMP: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v

  openmp:
    name: OpenMP native backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v

  tuning:
    name: Continuous-Bernoulli tuning integration
    runs-on: ubuntu-latest
    env:
      CATEGORICAL_SAMPLERS_NO_OPENMP: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[tuning]"
      - run: python -m unittest discover -s tests -v

  package:
    name: Source distribution round trip
    runs-on: ubuntu-latest
    env:
      CATEGORICAL_SAMPLERS_NO_OPENMP: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build
      - run: python -m build --sdist
      - run: python -m pip wheel --no-deps dist/*.tar.gz --wheel-dir wheelhouse
      - run: python -m pip install wheelhouse/*.whl
      - run: python -m categorical_samplers._wheel_smoke

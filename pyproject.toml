[build-system]
requires = ["setuptools>=68", "wheel", "numpy>=1.24"]
build-backend = "setuptools.build_meta"

[project]
name = "categorical-samplers"
version = "0.0.1"
description = "Fast categorical-family random samplers and validation utilities."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
  {name = "categorical-samplers contributors"}
]
dependencies = [
  "numpy>=1.24"
]

[project.optional-dependencies]
validation = [
  "scipy>=1.10"
]
torch = [
  "torch"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.cibuildwheel]
build = "cp39-* cp310-* cp311-* cp312-*"
skip = "pp* *-musllinux_*"
test-command = "python -m categorical_samplers._wheel_smoke"

[tool.cibuildwheel.linux]
archs = ["auto64"]

[tool.cibuildwheel.macos]
archs = ["auto"]

[tool.cibuildwheel.windows]
archs = ["auto64"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

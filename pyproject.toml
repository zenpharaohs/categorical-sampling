[build-system]
requires = ["setuptools>=68", "wheel", "numpy>=1.24"]
build-backend = "setuptools.build_meta"

[project]
name = "categorical-samplers"
version = "0.0.1"
description = "Fast categorical-family random samplers and validation utilities."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
  {name = "categorical-samplers contributors"}
]
dependencies = [
  "numpy>=1.24"
]

[project.optional-dependencies]
validation = [
  "scipy>=1.10"
]
torch = [
  "torch"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[build-system]
requires = ["setuptools>=68", "wheel", "numpy>=1.24"]
build-backend = "setuptools.build_meta"

[project]
name = "categorical-sampling"
version = "0.1.0a1"
description = "Fast categorical-family random samplers and validation utilities."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
  {name = "Andrew P. Mullhaupt"}
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
  "numpy>=1.24"
]

[project.urls]
Repository = "https://github.com/zenpharaohs/categorical-sampling"
Issues = "https://github.com/zenpharaohs/categorical-sampling/issues"

[project.optional-dependencies]
tuning = [
  "cb-sampler>=0.1.0a1,<0.2"
]
validation = [
  "scipy>=1.10"
]
torch = [
  "torch"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.cibuildwheel]
build = "cp39-* cp310-* cp311-* cp312-* cp313-* cp314-*"
skip = "pp* *-musllinux_*"
test-command = "python -m categorical_samplers._wheel_smoke"

[tool.cibuildwheel.linux]
archs = ["auto64"]

[tool.cibuildwheel.macos]
archs = ["auto"]

[tool.cibuildwheel.windows]
archs = ["auto64"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
